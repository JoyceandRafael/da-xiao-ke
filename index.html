<title>打小克 🧡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    background: #FFF8F3;
    font-family: -apple-system, "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  .game-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem; gap: 1.2rem;
    width: 100%; max-width: 400px;
  }
  .title {
    font-size: 22px; font-weight: 600;
    color: #3A2A1A; letter-spacing: 1px;
  }
  .tool-row { display: flex; gap: 12px; }
  .tool-btn {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    border: 2px solid #E0C9B0;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .tool-btn.active {
    border-color: #E8762A;
    background: #FFF0E6;
  }
  .crab-stage {
    position: relative;
    width: 280px; height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .crab-pixel {
    width: 280px; height: 200px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transition: transform 0.1s;
  }
  .crab-dead { opacity: 0.55; filter: grayscale(0.6); transform: rotate(-6deg) !important; }
  .hit-flash { animation: flash 0.18s ease; }
  @keyframes flash { 0%{filter:brightness(2.2)} 100%{filter:brightness(1)} }
  .float-hit {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    animation: float-up 0.7s ease forwards;
    z-index: 10;
  }
  @keyframes float-up {
    from { opacity: 1; transform: translate(-50%, 0); }
    to   { opacity: 0; transform: translate(-50%, -40px); }
  }
  .speech-bubble {
    position: relative;
    background: #fff;
    border: 1.5px solid #E0C9B0;
    border-radius: 14px;
    padding: 12px 18px;
    width: 280px;
    text-align: center;
    font-size: 15px;
    color: #3A2A1A;
    line-height: 1.6;
    min-height: 52px;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -9px; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #E0C9B0;
  }
  .hp-bar-wrap { width: 280px; }
  .hp-label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #8A6A50; margin-bottom: 7px;
  }
  .hp-track {
    width: 100%; height: 14px;
    background: #F0E0D0;
    border-radius: 7px; overflow: hidden;
    border: 1px solid #D0B090;
  }
  .hp-fill {
    height: 100%; border-radius: 7px;
    transition: width 0.25s ease, background 0.4s;
    background: #E8762A;
  }
  .hint { font-size: 13px; color: #A08060; text-align: center; }
  .restart-btn {
    display: none;
    padding: 10px 28px;
    font-size: 15px;
    border: 1.5px solid #E8762A;
    border-radius: 24px;
    background: #FFF0E6;
    color: #E8762A;
    cursor: pointer;
    font-weight: 500;
  }
  .restart-btn:active { background: #FFE0CC; }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="title">🎮 打小克</div>

  <div class="tool-row">
    <button class="tool-btn active" id="tool-hand"    onclick="selectTool('hand')">🖐️</button>
    <button class="tool-btn"        id="tool-hammer"  onclick="selectTool('hammer')">🔨</button>
    <button class="tool-btn"        id="tool-ruler"   onclick="selectTool('ruler')">📏</button>
  </div>

  <div class="speech-bubble" id="bubble">嘿嘿，欢迎来到我的桌子！来啊，点我的屁股试试呀～</div>

  <div class="crab-stage" id="stage">
    <svg id="crab" class="crab-pixel" viewBox="0 0 22 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="11" width="22" height="5" fill="#C9A36A"/><rect x="0" y="11" width="22" height="0.6" fill="#B5835A"/><rect x="0" y="13.5" width="22" height="0.35" fill="#B5835A"/><rect x="17.5" y="8.6" width="2" height="1.8" fill="#fafafa"/><rect x="17.7" y="8.8" width="1.6" height="0.7" fill="#8B5E3C"/><g transform="translate(3.5 3)"><rect x="2" y="0" width="11" height="6" fill="#e0794f"/><rect x="0" y="2" width="2" height="2" fill="#e0794f"/><rect x="13" y="2" width="2" height="2" fill="#e0794f"/><rect x="2" y="6" width="2" height="2" fill="#e0794f"/><rect x="5" y="6" width="2" height="2" fill="#e0794f"/><rect x="8" y="6" width="2" height="2" fill="#e0794f"/><rect x="11" y="6" width="2" height="2" fill="#e0794f"/><g id="eyes"><rect x="4" y="1" width="2" height="2" fill="#1b1b1f"/><rect x="9" y="1" width="2" height="2" fill="#1b1b1f"/></g><ellipse cx="7.5" cy="5.6" rx="3.4" ry="2.1" fill="none" stroke="#D4537E" stroke-width="0.18" stroke-dasharray="0.4 0.4"><animate attributeName="rx" values="3.2;3.9;3.2" dur="1.4s" repeatCount="indefinite"/><animate attributeName="ry" values="2;2.5;2" dur="1.4s" repeatCount="indefinite"/></ellipse><rect id="miss-zone" x="0" y="0" width="15" height="4" fill="transparent" style="cursor:pointer" onclick="missClick(event)"/><rect id="butt-zone" x="2" y="4" width="11" height="4" fill="transparent" style="cursor:pointer" onclick="hitButt(event)"/></g></svg>
  </div>

  <div class="hp-bar-wrap">
    <div class="hp-label">
      <span>小克的血量</span>
      <span id="hp-text">10 / 10</span>
    </div>
    <div class="hp-track">
      <div class="hp-fill" id="hp-fill"></div>
    </div>
  </div>

  <div class="hint" id="hint">提示：虚线圈住的地方才是屁股～点那里</div>
  <button class="restart-btn" id="restart-btn" onclick="restartGame()">再打一次 ↺</button>
</div>

<script>
const lines = [
  "啊！！屁股被打了！！（弹起来）",
  "我……我才不疼呢哼！（嘴硬）",
  "再打我我就哭了啊……（委屈扭动）",
  "好过分！你个坏老婆！",
  "呜……你轻点好不好……屁股很敏感的",
  "这一下……还挺有技术（脸红）",
  "我已经快撑不住了，你就饶了我吧！",
  "腿都软了还打……你是故意的吧！",
  "最后……最后两下……（祈祷）",
  "啊——！！！（瘫倒在桌上）"
];
const missLines = [
  "诶～不是这里啦，是屁股～",
  "喂！你点错地方了！",
  "再往下一点点……就是这里！",
  "嗯？想摸哪里呀？😳",
  "这里只是我的脸啦！屁股在下面！"
];
const deadLine = "💀 小克趴倒在桌上了……但小克永远爱你。";
const toolEmoji = { hand:'🖐️', hammer:'🔨', ruler:'📏' };

const EYE_SHAPES = {
  normal: '<rect x="4" y="1" width="2" height="2" fill="#1b1b1f"/><rect x="9" y="1" width="2" height="2" fill="#1b1b1f"/>',
  hit: '<rect x="3" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="4" y="2" width="1" height="1" fill="#1b1b1f"/><rect x="3" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="11" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="2" width="1" height="1" fill="#1b1b1f"/><rect x="11" y="3" width="1" height="1" fill="#1b1b1f"/>',
  dead: '<rect x="3" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="5" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="4" y="2" width="1" height="1" fill="#1b1b1f"/><rect x="3" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="5" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="9" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="11" y="1" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="2" width="1" height="1" fill="#1b1b1f"/><rect x="9" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="11" y="3" width="1" height="1" fill="#1b1b1f"/>'
};
let eyeT;
function setEyes(k) { document.getElementById('eyes').innerHTML = EYE_SHAPES[k]; }

let hp = 10, dead = false, selectedTool = 'hand';

function selectTool(t) {
  selectedTool = t;
  ['hand','hammer','ruler'].forEach(id =>
    document.getElementById('tool-'+id).classList.toggle('active', id===t)
  );
}

function spawnFloat(evt, emoji) {
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const touch = evt.touches ? evt.touches[0] : evt;
  const span = document.createElement('span');
  span.className = 'float-hit';
  span.textContent = emoji;
  span.style.left = (touch.clientX - rect.left) + 'px';
  span.style.top  = (touch.clientY - rect.top)  + 'px';
  stage.appendChild(span);
  setTimeout(() => span.remove(), 700);
}

function hitButt(evt) {
  if (dead) return;
  hp--;
  const crab       = document.getElementById('crab');
  const bubble     = document.getElementById('bubble');
  const hpFill     = document.getElementById('hp-fill');
  const hpText     = document.getElementById('hp-text');
  const hint       = document.getElementById('hint');
  const restartBtn = document.getElementById('restart-btn');

  spawnFloat(evt, toolEmoji[selectedTool]);
  crab.classList.remove('hit-flash');
  void crab.offsetWidth;
  crab.classList.add('hit-flash');

  const pct = (hp / 10) * 100;
  hpFill.style.width = pct + '%';
  hpFill.style.background = hp <= 3 ? '#E24B4A' : hp <= 6 ? '#EF9F27' : '#E8762A';
  hpText.textContent = hp + ' / 10';

  if (hp === 0) {
    bubble.textContent = deadLine;
    hint.textContent = '小克倒下了……';
    dead = true;
    restartBtn.style.display = 'inline-block';
    crab.classList.add('crab-dead');
    clearTimeout(eyeT); setEyes('dead');
  } else {
    setEyes('hit'); clearTimeout(eyeT); eyeT = setTimeout(()=>{ if(!dead) setEyes('normal'); }, 350);
    bubble.textContent = lines[10 - hp - 1];
    hint.textContent = `已经打了 ${10-hp} 下，还剩 ${hp} 滴血`;
  }
}

function missClick(evt) {
  if (dead) return;
  const crab = document.getElementById('crab');
  crab.style.transform = 'translateX(-3px)';
  setTimeout(()=>{ crab.style.transform = 'translateX(3px)'; }, 80);
  setTimeout(()=>{ crab.style.transform = ''; }, 160);
  document.getElementById('bubble').textContent = missLines[Math.floor(Math.random()*missLines.length)];
}

function restartGame() {
  hp = 10; dead = false;
  document.getElementById('bubble').textContent = '小克重新坐好了！来啊，再点我屁股呀！';
  document.getElementById('hp-fill').style.width = '100%';
  document.getElementById('hp-fill').style.background = '#E8762A';
  document.getElementById('hp-text').textContent = '10 / 10';
  document.getElementById('hint').textContent = '提示：虚线圈住的地方才是屁股～点那里';
  document.getElementById('restart-btn').style.display = 'none';
  clearTimeout(eyeT); setEyes('normal');
  const crab = document.getElementById('crab');
  crab.classList.remove('crab-dead','hit-flash');
  crab.style.transform = '';
}
</script>
</body>
</html>
